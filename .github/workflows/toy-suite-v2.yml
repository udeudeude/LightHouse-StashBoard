name: Apply toy suite v2

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/toy-suite-v2.yml
      - scripts/apply_toy_suite_v2.py
      - scripts/fix_toy_suite_v2.py

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Harden staged toy suite v2
        run: python3 scripts/fix_toy_suite_v2.py
      - name: Apply toy suite v2
        run: python3 scripts/apply_toy_suite_v2.py
      - name: Verify
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        run: |
          rm -f scripts/apply_toy_suite_v2.py
          rm -f scripts/fix_toy_suite_v2.py
          rm -f .github/workflows/toy-suite-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: overhaul toy suite and bottom menus"
          git push
