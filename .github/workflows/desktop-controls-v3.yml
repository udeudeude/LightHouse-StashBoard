name: Apply full toy suite through stable runner

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/desktop-controls-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Apply staged toy suite
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/toy-suite-v1.yml').read_text()
          for old, new in {
              'Icons.autoAwesome': 'Icons.auto_awesome',
              'Icons.hourglassEmpty': 'Icons.hourglass_empty',
              'Icons.flagOutlined': 'Icons.flag_outlined',
              'Icons.gridView': 'Icons.grid_view',
              'Icons.timerOutlined': 'Icons.timer_outlined',
              'Icons.filterCenterFocus': 'Icons.filter_center_focus',
              'Icons.extensionOutlined': 'Icons.extension_outlined',
              'Icons.casinoOutlined': 'Icons.casino_outlined',
          }.items():
              source = source.replace(old, new)
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          extracted = source[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in extracted.splitlines()
          )

          strict = """def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)
          """
          tolerant = """def replace_once(old, new, label):
              global text
              if old in text:
                  text = text.replace(old, new, 1)
                  return
              import re
              lines = old.splitlines()
              pattern = r'^[ \\t]*' + r'\\n[ \\t]*'.join(
                  re.escape(line.strip()) for line in lines
              )
              match = re.search(pattern, text, re.MULTILINE)
              if match is None:
                  raise SystemExit(f'{label} not found')
              text = text[:match.start()] + new + text[match.end():]
          """
          if strict not in script:
              raise SystemExit('replace_once helper not found in staged script')
          script = script.replace(strict, tolerant, 1)
          stale_guard = """if listener_block not in text:
              raise SystemExit('board listener block not found')
          """
          if stale_guard not in script:
              raise SystemExit('obsolete board listener guard not found')
          script = script.replace(stale_guard, '', 1)
          exec(compile(script, 'toy-suite-v1', 'exec'), {'__name__': '__main__'})

          target = Path('lib/ui/board_screen_next.dart')
          code = target.read_text()
          code = code.replace('math.max(1, (size.width', 'math.max(1.0, (size.width')
          code = code.replace('math.max(1, (size.height', 'math.max(1.0, (size.height')
          code = code.replace('next[id] = progress.clamp(0, 1);', 'next[id] = progress.clamp(0, 1).toDouble();')
          code = code.replace('final count = math.min(8, math.max(4, elements.length * 2));', 'final count = math.min(8, math.max(4, elements.length * 2)).toInt();')
          target.write_text(code)
          PY
      - name: Verify
        shell: bash
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/toy-suite-v1.yml
          rm -f .github/toy-suite-v1.trigger
          rm -f .github/workflows/desktop-controls-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete toy suite"
          git push
