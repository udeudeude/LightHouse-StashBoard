name: Apply physical UI fixes v5

on:
  push:
    branches: [lighthouse-2-rewrite]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Run robust revision script
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/physical-ui-fix-v4.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          lines = source[start:end].splitlines()
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in lines
          )
          broken = '''              "        const SnackBar(content: Text('Motion access was not granted.')),
",'''
          fixed = '''              "        const SnackBar(content: Text('Motion access was not granted.')),",'''
          if broken not in script:
              raise SystemExit('expected motion snackbar source fragment not found')
          script = script.replace(broken, fixed, 1)
          exec(compile(script, 'physical-ui-fix-v4', 'exec'), {'__name__': '__main__'})
          PY
      - name: Verify
        shell: bash
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/physical-ui-fix-v2.yml
          rm -f .github/workflows/physical-ui-fix-v3.yml
          rm -f .github/workflows/physical-ui-fix-v4.yml
          rm -f .github/workflows/physical-ui-fix-v5.yml
          rm -f .github/physical-ui-fix-v3.trigger
          rm -f .github/physical-ui-fix-v4.trigger
          rm -f .github/physical-ui-fix-v5.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: physical orientation motion and toy controls"
          git push
