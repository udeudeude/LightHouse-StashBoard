name: Apply board refinements round 2

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/refine-board-round2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply refinements
        run: |
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path
          payload = Path('.github/scripts/refine_board_round2.b85').read_bytes()
          source = zlib.decompress(base64.b85decode(payload)).decode()
          exec(compile(source, 'refine_board_round2.py', 'exec'))
          PY
      - name: Format Dart
        run: dart format lib test
      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test web pubspec.yaml CHANGELOG.md
          git commit -m "ux: expand board controls underlays and randomizers"
          git push origin HEAD:lighthouse-2-rewrite
