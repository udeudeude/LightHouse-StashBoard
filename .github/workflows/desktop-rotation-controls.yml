name: Add desktop rotation controls

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/desktop-rotation-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch source
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          dart format lib/ui/board_screen_next.dart
      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/board_screen_next.dart
          git commit -m "ux: make desktop rotation fully accessible"
          git push origin HEAD:lighthouse-2-rewrite
