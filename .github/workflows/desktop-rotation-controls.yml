name: Apply board refinements

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/desktop-rotation-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply refinements
        run: python3 .github/scripts/refine_board.py
      - name: Format Dart
        run: dart format lib test
      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No source changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "ux: refine overlap orientation and underlays"
          git push origin HEAD:lighthouse-2-rewrite
