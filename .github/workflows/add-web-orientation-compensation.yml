name: Add web orientation compensation

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/add-web-orientation-compensation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/add_web_orientation_compensation.py
      - name: Verify
        run: |
          dart format lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-web-orientation-compensation.yml .github/scripts/add_web_orientation_compensation.py
          git add lib/ui/board_screen_next.dart lib/platform/web_orientation.dart lib/platform/web_orientation_stub.dart lib/platform/web_orientation_web.dart web/index.html README.md CHANGELOG.md pubspec.yaml
          git commit -m "feat: keep web board fixed through rotation"
          git push origin HEAD:lighthouse-2-rewrite
