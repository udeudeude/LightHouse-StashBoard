name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-toy-suite-v2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lighthouse-2-rewrite' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Harden staged patch
        run: python3 scripts/fix_toy_suite_v2.py
      - name: Apply toy suite v2
        run: python3 scripts/apply_toy_suite_v2.py
      - name: Verify
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Restore CI and commit
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            push:
            pull_request:

          jobs:
            analyze-and-test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: subosito/flutter-action@v2
                  with:
                    channel: stable
                    cache: true
                - run: flutter pub get
                - run: dart format --output=none --set-exit-if-changed lib test
                - run: flutter analyze
                - run: flutter test
          YAML
          rm -f scripts/apply_toy_suite_v2.py scripts/fix_toy_suite_v2.py .github/workflows/toy-suite-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: overhaul toy suite and bottom menus"
          git push
