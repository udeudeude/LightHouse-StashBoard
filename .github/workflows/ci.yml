name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  publish-verified-toy-suite:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lighthouse-2-rewrite' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - name: Apply previously verified toy suite
        run: |
          python3 scripts/fix_toy_suite_v2.py
          python3 scripts/apply_toy_suite_v2.py
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/board_screen_next.dart lib/ui/toy_overlay.dart
          git commit -m "feat: overhaul toy suite and bottom menus"
          git push
