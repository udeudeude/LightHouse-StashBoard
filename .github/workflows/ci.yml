name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-toy-suite-v2:
    if: github.event_name == 'push' && github.ref == 'refs/heads/lighthouse-2-rewrite' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Harden staged patch
        run: python3 scripts/fix_toy_suite_v2.py
      - name: Apply toy suite v2
        run: python3 scripts/apply_toy_suite_v2.py
      - name: Verify
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit verified source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/board_screen_next.dart lib/ui/toy_overlay.dart
          git commit -m "feat: overhaul toy suite and bottom menus"
          git push
