name: Restore face-down-only credits

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/restore-weird-credits.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/restore_weird_credits.py
      - name: Verify
        run: |
          dart format lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/restore-weird-credits.yml .github/scripts/restore_weird_credits.py
          git add lib/ui/board_screen_next.dart README.md CHANGELOG.md
          git commit -m "fix: keep credits face-down only"
          git push origin HEAD:lighthouse-2-rewrite
