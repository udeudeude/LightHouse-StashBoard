name: Apply physical UI fixes v4

on:
  push:
    branches: [lighthouse-2-rewrite]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
      - name: Apply revision
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def ls(*items):
              return '\n'.join(items)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} not found')
              return text.replace(old, new, 1)

          def regex_once(text, pattern, replacement, label):
              result, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label} matched {count} times')
              return result

          # Safari bridge. Observe orientation directly and retain motion samples
          # from accelerationIncludingGravity after permission is granted.
          path = Path('web/index.html')
          text = path.read_text()
          bridge = ls(
              '  <script>',
              '    const lighthouseOrientationState = { angle: 0 };',
              '    const lighthouseMotionState = {',
              '      x: Number.NaN,',
              '      y: Number.NaN,',
              '      z: Number.NaN,',
              '      installed: false,',
              '    };',
              '',
              '    function lighthouseNormalizeQuarterTurn(angle) {',
              '      const normalized = ((Number(angle) % 360) + 360) % 360;',
              '      return (Math.round(normalized / 90) * 90) % 360;',
              '    }',
              '',
              '    function lighthouseReadOrientationAngle() {',
              "      if (typeof window.orientation === 'number') {",
              '        return lighthouseNormalizeQuarterTurn(window.orientation);',
              '      }',
              "      if (screen.orientation && typeof screen.orientation.angle === 'number') {",
              '        return lighthouseNormalizeQuarterTurn(screen.orientation.angle);',
              '      }',
              '      return window.innerWidth > window.innerHeight ? 90 : 0;',
              '    }',
              '',
              '    function lighthouseUpdateOrientation() {',
              '      lighthouseOrientationState.angle = lighthouseReadOrientationAngle();',
              '    }',
              '',
              '    function lighthouseInstallMotionListener() {',
              '      if (lighthouseMotionState.installed) return;',
              '      lighthouseMotionState.installed = true;',
              "      window.addEventListener('devicemotion', function (event) {",
              '        const acceleration = event.accelerationIncludingGravity;',
              '        if (!acceleration) return;',
              '        lighthouseMotionState.x = Number(acceleration.x);',
              '        lighthouseMotionState.y = Number(acceleration.y);',
              '        lighthouseMotionState.z = Number(acceleration.z);',
              '      }, { passive: true });',
              '    }',
              '',
              '    lighthouseUpdateOrientation();',
              "    window.addEventListener('orientationchange', function () {",
              '      lighthouseUpdateOrientation();',
              '      window.setTimeout(lighthouseUpdateOrientation, 80);',
              '      window.setTimeout(lighthouseUpdateOrientation, 300);',
              '    });',
              "    window.addEventListener('resize', lighthouseUpdateOrientation, { passive: true });",
              '',
              '    window.lighthouseOrientationAngle = function () {',
              '      return lighthouseOrientationState.angle;',
              '    };',
              '',
              '    window.lighthouseRequestMotionPermission = async function () {',
              '      try {',
              '        let granted = true;',
              "        if (typeof DeviceMotionEvent !== 'undefined' &&",
              "            typeof DeviceMotionEvent.requestPermission === 'function') {",
              "          granted = (await DeviceMotionEvent.requestPermission()) === 'granted';",
              '        }',
              '        if (granted) lighthouseInstallMotionListener();',
              '        return granted;',
              '      } catch (_) {',
              '        return false;',
              '      }',
              '    };',
              '',
              '    window.lighthouseMotionX = function () { return lighthouseMotionState.x; };',
              '    window.lighthouseMotionY = function () { return lighthouseMotionState.y; };',
              '    window.lighthouseMotionZ = function () { return lighthouseMotionState.z; };',
              '  </script>',
          )
          text = regex_once(
              text,
              r"  <script>\n\s*window\.lighthouseRequestMotionPermission.*?  </script>",
              lambda _: bridge,
              'Safari bridge',
          )
          path.write_text(text)

          Path('lib/platform/motion_permission_web.dart').write_text(ls(
              "import 'dart:js_interop';",
              '',
              "@JS('lighthouseRequestMotionPermission')",
              'external JSPromise<JSBoolean> _requestMotionPermission();',
              '',
              "@JS('lighthouseMotionX')",
              'external JSNumber _motionX();',
              '',
              "@JS('lighthouseMotionY')",
              'external JSNumber _motionY();',
              '',
              "@JS('lighthouseMotionZ')",
              'external JSNumber _motionZ();',
              '',
              'Future<bool> requestWebMotionPermission() async {',
              '  try {',
              '    final result = await _requestMotionPermission().toDart;',
              '    return result.toDart;',
              '  } on Object {',
              '    return false;',
              '  }',
              '}',
              '',
              '({double x, double y, double z})? currentWebMotionSample() {',
              '  try {',
              '    final x = _motionX().toDartDouble;',
              '    final y = _motionY().toDartDouble;',
              '    final z = _motionZ().toDartDouble;',
              '    if (!x.isFinite || !y.isFinite || !z.isFinite) return null;',
              '    return (x: x, y: y, z: z);',
              '  } on Object {',
              '    return null;',
              '  }',
              '}',
              '',
          ))
          Path('lib/platform/motion_permission_stub.dart').write_text(ls(
              'Future<bool> requestWebMotionPermission() async => true;',
              '',
              '({double x, double y, double z})? currentWebMotionSample() => null;',
              '',
          ))

          path = Path('lib/ui/board_screen_next.dart')
          text = path.read_text()

          text = replace_once(
              text,
              ls('  double? _webReferenceOrientationAngle;', '  double? _rotationSnapDegrees;'),
              ls(
                  '  double? _webReferenceOrientationAngle;',
                  '  double? _webObservedOrientationAngle;',
                  '  Timer? _webOrientationPollTimer;',
                  '  double? _rotationSnapDegrees;',
              ),
              'web orientation fields',
          )
          text = replace_once(
              text,
              ls('  bool _randomizerRunning = false;', '  bool _entropyEnabled = false;', '  Timer? _entropyTimer;'),
              ls(
                  '  bool _randomizerRunning = false;',
                  '  bool _entropyEnabled = false;',
                  '  bool _lightLotteryToyVisible = true;',
                  '  bool _entropyToyVisible = true;',
                  '  Timer? _entropyTimer;',
              ),
              'toy fields',
          )
          text = replace_once(
              text,
              ls('  StreamSubscription<AccelerometerEvent>? _accelerometerSubscription;', '  Timer? _faceDownTimer;'),
              ls(
                  '  StreamSubscription<AccelerometerEvent>? _accelerometerSubscription;',
                  '  Timer? _webMotionTimer;',
                  '  Timer? _faceDownTimer;',
              ),
              'web motion timer field',
          )
          text = replace_once(
              text,
              ls('  bool _motionPermissionAttempted = false;', '  double? _faceUpZSign;'),
              ls(
                  '  bool _motionPermissionAttempted = false;',
                  '  double? _faceUpZSign;',
                  '  double? _faceUpCandidateSign;',
                  '  int _faceUpStableSamples = 0;',
              ),
              'motion calibration fields',
          )

          orientation_block = ls(
              '  @override',
              '  void didChangeDependencies() {',
              '    super.didChangeDependencies();',
              '    if (kIsWeb && defaultTargetPlatform == TargetPlatform.iOS) {',
              '      final media = MediaQuery.of(context);',
              '      _webBoardSize ??= media.size;',
              '      _webBoardPadding ??= media.padding;',
              '      _webBoardViewPadding ??= media.viewPadding;',
              '      final angle = currentWebOrientationAngle();',
              '      _webReferenceOrientationAngle ??= angle;',
              '      _webObservedOrientationAngle ??= angle;',
              '      _webOrientationPollTimer ??= Timer.periodic(',
              '        const Duration(milliseconds: 120),',
              '        (_) => _pollWebOrientation(),',
              '      );',
              '    }',
              '    if (_orientationLocked || kIsWeb) return;',
              '    _orientationLocked = true;',
              '    final orientation = MediaQuery.orientationOf(context);',
              '    SystemChrome.setPreferredOrientations([',
              '      orientation == Orientation.portrait',
              '          ? DeviceOrientation.portraitUp',
              '          : DeviceOrientation.landscapeLeft,',
              '    ]);',
              '  }',
              '',
              '  void _pollWebOrientation() {',
              '    if (!mounted || !kIsWeb || defaultTargetPlatform != TargetPlatform.iOS) {',
              '      return;',
              '    }',
              '    final angle = currentWebOrientationAngle();',
              '    if (angle == _webObservedOrientationAngle) return;',
              '    setState(() => _webObservedOrientationAngle = angle);',
              '  }',
              '',
              '  @override',
              '  void didChangeMetrics() {',
              '    if (!kIsWeb || defaultTargetPlatform != TargetPlatform.iOS) return;',
              '    WidgetsBinding.instance.addPostFrameCallback((_) {',
              '      if (mounted) {',
              '        _webObservedOrientationAngle = currentWebOrientationAngle();',
              '        setState(() {});',
              '      }',
              '    });',
              '    Future<void>.delayed(const Duration(milliseconds: 100), () {',
              '      if (mounted) _pollWebOrientation();',
              '    });',
              '    Future<void>.delayed(const Duration(milliseconds: 340), () {',
              '      if (mounted) _pollWebOrientation();',
              '    });',
              '  }',
              '',
          )
          text = regex_once(
              text,
              r"  @override\n  void didChangeDependencies\(\) \{.*?(?=  @override\n  void didChangeAppLifecycleState)",
              lambda _: orientation_block,
              'orientation lifecycle',
          )

          text = replace_once(
              text,
              ls('    _faceDownTimer?.cancel();', '    _desktopScrollEndTimer?.cancel();'),
              ls(
                  '    _faceDownTimer?.cancel();',
                  '    _webMotionTimer?.cancel();',
                  '    _webOrientationPollTimer?.cancel();',
                  '    _desktopScrollEndTimer?.cancel();',
              ),
              'dispose timers',
          )

          motion_block = ls(
              '  void _startFaceDownMonitoring() {',
              '    if (defaultTargetPlatform != TargetPlatform.iOS &&',
              '        defaultTargetPlatform != TargetPlatform.android) {',
              '      return;',
              '    }',
              '    if (kIsWeb && defaultTargetPlatform == TargetPlatform.iOS) {',
              '      _startWebMotionMonitoring();',
              '      return;',
              '    }',
              '    if (_accelerometerSubscription != null) return;',
              '    _accelerometerSubscription = accelerometerEventStream(',
              '      samplingPeriod: const Duration(milliseconds: 140),',
              '    ).listen(_handleAccelerometer, onError: (_) {});',
              '  }',
              '',
              '  void _startWebMotionMonitoring() {',
              '    if (!kIsWeb || defaultTargetPlatform != TargetPlatform.iOS) return;',
              '    _webMotionTimer?.cancel();',
              '    _webMotionTimer = Timer.periodic(',
              '      const Duration(milliseconds: 120),',
              '      (_) {',
              '        final sample = currentWebMotionSample();',
              '        if (sample != null) {',
              '          _handleAcceleration(sample.x, sample.y, sample.z);',
              '        }',
              '      },',
              '    );',
              '  }',
              '',
              '  Future<void> _ensureMotionPermission({bool force = false}) async {',
              '    if (!kIsWeb || defaultTargetPlatform != TargetPlatform.iOS) {',
              '      _startFaceDownMonitoring();',
              '      return;',
              '    }',
              '    if (_motionPermissionAttempted && !force) return;',
              '    _motionPermissionAttempted = true;',
              '    final granted = await requestWebMotionPermission();',
              '    if (!mounted) return;',
              '    if (granted) {',
              '      _startWebMotionMonitoring();',
              '    } else if (force) {',
              '      ScaffoldMessenger.of(context).showSnackBar(',
              "        const SnackBar(content: Text('Motion access was not granted.')),
",
              '      );',
              '    }',
              '  }',
              '',
              '  void _handleAccelerometer(AccelerometerEvent event) {',
              '    _handleAcceleration(event.x, event.y, event.z);',
              '  }',
              '',
              '  void _handleAcceleration(double x, double y, double z) {',
              '    final zDominant =',
              '        z.abs() > 6.0 && z.abs() > x.abs() * 1.05 && z.abs() > y.abs() * 1.05;',
              '    if (!zDominant) {',
              '      _faceDownTimer?.cancel();',
              '      _faceDownTimer = null;',
              '      return;',
              '    }',
              '',
              '    final sign = z.sign;',
              '    if (_faceUpZSign == null) {',
              '      if (_faceUpCandidateSign == sign) {',
              '        _faceUpStableSamples += 1;',
              '      } else {',
              '        _faceUpCandidateSign = sign;',
              '        _faceUpStableSamples = 1;',
              '      }',
              '      if (_faceUpStableSamples >= 3) {',
              '        _faceUpZSign = sign;',
              '      }',
              '      return;',
              '    }',
              '',
              '    final faceDown = sign != _faceUpZSign;',
              '    if (!faceDown) {',
              '      _faceDownTimer?.cancel();',
              '      _faceDownTimer = null;',
              '      _faceDownLatched = false;',
              '      if (_creditsVisible && mounted) {',
              '        setState(() => _creditsVisible = false);',
              '      }',
              '      return;',
              '    }',
              '    if (_faceDownLatched || _faceDownTimer != null) return;',
              '',
              '    _faceDownTimer = Timer(const Duration(milliseconds: 360), () {',
              '      _faceDownTimer = null;',
              '      if (!mounted) return;',
              '      _faceDownLatched = true;',
              '      setState(() => _creditsVisible = true);',
              '    });',
              '  }',
              '',
          )
          # Fix one deliberately split source line above before insertion.
          motion_block = motion_block.replace("        const SnackBar(content: Text('Motion access was not granted.')),\n\n", "        const SnackBar(content: Text('Motion access was not granted.')),\n")
          text = regex_once(
              text,
              r"  void _startFaceDownMonitoring\(\) \{.*?(?=  Future<void> _loadInteractionPreferences)",
              lambda _: motion_block,
              'motion subsystem',
          )

          prefs_old = ls(
              "      _gridSnapEnabled =",
              "          preferences.getBool('lighthouse.gridSnapEnabled.v1') ?? false;",
              '    });',
          )
          prefs_new = ls(
              "      _gridSnapEnabled =",
              "          preferences.getBool('lighthouse.gridSnapEnabled.v1') ?? false;",
              "      _lightLotteryToyVisible =",
              "          preferences.getBool('lighthouse.toy.lightLottery.visible.v1') ?? true;",
              "      _entropyToyVisible =",
              "          preferences.getBool('lighthouse.toy.entropy.visible.v1') ?? true;",
              '    });',
          )
          text = replace_once(text, prefs_old, prefs_new, 'toy preferences')

          grid_method = ls(
              '  Future<void> _toggleGridSnap() async {',
              '    setState(() => _gridSnapEnabled = !_gridSnapEnabled);',
              '    final preferences = await SharedPreferences.getInstance();',
              '    await preferences.setBool(',
              "      'lighthouse.gridSnapEnabled.v1',",
              '      _gridSnapEnabled,',
              '    );',
              '  }',
          )
          toy_methods = ls(
              '',
              '  Future<void> _toggleLightLotteryToyVisibility() async {',
              '    setState(() => _lightLotteryToyVisible = !_lightLotteryToyVisible);',
              '    final preferences = await SharedPreferences.getInstance();',
              '    await preferences.setBool(',
              "      'lighthouse.toy.lightLottery.visible.v1',",
              '      _lightLotteryToyVisible,',
              '    );',
              '  }',
              '',
              '  Future<void> _toggleEntropyToyVisibility() async {',
              '    if (_entropyToyVisible && _entropyEnabled) {',
              '      _toggleEntropy();',
              '    }',
              '    setState(() => _entropyToyVisible = !_entropyToyVisible);',
              '    final preferences = await SharedPreferences.getInstance();',
              '    await preferences.setBool(',
              "      'lighthouse.toy.entropy.visible.v1',",
              '      _entropyToyVisible,',
              '    );',
              '  }',
          )
          text = replace_once(text, grid_method, grid_method + toy_methods, 'toy methods')

          lottery_old = regex_once
          lottery_loop = ls(
              '    const beat = Duration(milliseconds: 120);',
              '    if (!await wait(beat)) return;',
              '    final milliseconds = 3000 + _random.nextInt(7001);',
              '    final endAt = DateTime.now().add(Duration(milliseconds: milliseconds));',
              '    String? previousId;',
              '    while (DateTime.now().isBefore(endAt)) {',
              '      final elements = _controller.state.elements;',
              '      if (elements.isEmpty) break;',
              '      final candidates = previousId == null || elements.length == 1',
              '          ? elements',
              '          : elements.where((element) => element.id != previousId).toList();',
              '      final element = candidates[_random.nextInt(candidates.length)];',
              '      if (!mounted || generation != _effectGeneration) return;',
              '      setState(() {',
              '        _effectOpacities = {',
              '          for (final current in elements)',
              '            current.id: current.id == element.id ? 1.0 : 0.0,',
              '        };',
              '      });',
              '      previousId = element.id;',
              '      if (!await wait(beat)) return;',
              '    }',
              '',
          )
          text = regex_once(
              text,
              r"    if \(!await wait\(const Duration\(milliseconds: 220\)\)\) return;.*?(?=    final elements = _controller\.state\.elements;\n    if \(elements\.isEmpty)",
              lambda _: lottery_loop,
              'lottery flashing loop',
          )
          text = replace_once(
              text,
              '    if (!await wait(const Duration(milliseconds: 320))) return;',
              '    if (!await wait(const Duration(milliseconds: 240))) return;',
              'lottery reveal pause',
          )

          toy_items = ls(
              '    final toyItems = <Widget>[',
              '      MenuItemButton(',
              '        closeOnActivate: false,',
              '        leadingIcon: _checkmark(_lightLotteryToyVisible),',
              '        onPressed: _toggleLightLotteryToyVisibility,',
              "        child: const Text('Light Lottery'),",
              '      ),',
              '      MenuItemButton(',
              '        closeOnActivate: false,',
              '        leadingIcon: _checkmark(_entropyToyVisible),',
              '        onPressed: _toggleEntropyToyVisibility,',
              "        child: const Text('Entropy Delete'),",
              '      ),',
              '    ];',
              '',
          )
          text = replace_once(text, '    final rotationItems = <Widget>[', toy_items + '    final rotationItems = <Widget>[', 'toy menu items')

          display_anchor = ls(
              '        SubmenuButton(',
              '          submenuIcon: const WidgetStatePropertyAll<Widget?>(SizedBox.shrink()),',
              '          menuChildren: [',
              '            MenuItemButton(',
              '              onPressed: _showCalibrationCheck,',
              "              child: const Text('Size'),",
          )
          toys_submenu = ls(
              '        SubmenuButton(',
              '          submenuIcon: const WidgetStatePropertyAll<Widget?>(SizedBox.shrink()),',
              '          menuChildren: toyItems,',
              "          child: const Text('Toys'),",
              '        ),',
          ) + '\n'
          text = replace_once(text, display_anchor, toys_submenu + display_anchor, 'Toys submenu')

          text = text.replace("('Light lottery', 'Tap the starburst button at lower right'),", "('Light lottery', 'Enable in Menu > Toys, then tap the starburst button'),")
          text = text.replace("('Entropy', 'Toggle the small deletion control at lower right'),", "('Entropy', 'Enable in Menu > Toys, then toggle the deletion control'),")

          toy_controls = ls(
              '  Widget _toyControls() => Row(',
              '    mainAxisSize: MainAxisSize.min,',
              '    children: [',
              '      if (_lightLotteryToyVisible)',
              '        IconButton(',
              "          tooltip: 'Light lottery',",
              '          onPressed: _randomizerRunning ? null : _runLightRandomizer,',
              '          icon: Text(',
              "            '✦',",
              '            style: TextStyle(',
              '              color: _randomizerRunning ? Colors.white30 : Colors.white70,',
              '              fontSize: 23,',
              '              fontWeight: FontWeight.w300,',
              '            ),',
              '          ),',
              '        ),',
              '      if (_entropyToyVisible)',
              '        Semantics(',
              '          button: true,',
              '          toggled: _entropyEnabled,',
              "          label: 'Delete one random footprint every 30 seconds',",
              '          child: Tooltip(',
              "            message: 'Entropy · delete one random footprint every 30 seconds',",
              '            child: GestureDetector(',
              '              onTap: _toggleEntropy,',
              '              behavior: HitTestBehavior.opaque,',
              '              child: SizedBox(',
              '                width: 40,',
              '                height: 40,',
              '                child: CustomPaint(',
              '                  painter: _EntropyControlPainter(enabled: _entropyEnabled),',
              '                ),',
              '              ),',
              '            ),',
              '          ),',
              '        ),',
              '    ],',
              '  );',
              '',
          )
          text = regex_once(
              text,
              r"  Widget _randomizerControls\(\) => Row\(.*?(?=  Widget _credits\(\))",
              lambda _: toy_controls,
              'toy controls',
          )
          text = replace_once(text, '              child: _randomizerControls(),', '              child: _toyControls(),', 'toy control use')

          rotation_method = ls(
              '  double _webBoardRotationRadians() {',
              '    final reference = _webReferenceOrientationAngle;',
              '    final current = _webObservedOrientationAngle;',
              '    if (reference == null || current == null) return 0;',
              '    final raw = current - reference;',
              '    final signed = ((raw + 540) % 360) - 180;',
              '    final quarterTurns = (signed / 90).round();',
              '    return -quarterTurns * math.pi / 2;',
              '  }',
          )
          text = regex_once(
              text,
              r"  double _webBoardRotationRadians\(\) \{.*?\n  \}",
              lambda _: rotation_method,
              'web rotation method',
          )
          text = replace_once(
              text,
              ls('      final outer = radius - 3;', '      final inner = radius - (i % 2 == 0 ? 6 : 5);'),
              ls('      final outer = radius - 0.35;', '      final inner = radius - (i % 2 == 0 ? 4.5 : 3.5);'),
              'degree tick placement',
          )

          path.write_text(text)
          PY
      - name: Verify
        shell: bash
        run: |
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/physical-ui-fix-v2.yml
          rm -f .github/workflows/physical-ui-fix-v3.yml
          rm -f .github/workflows/physical-ui-fix-v4.yml
          rm -f .github/physical-ui-fix-v3.trigger
          rm -f .github/physical-ui-fix-v4.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: physical orientation motion and toy controls"
          git push
