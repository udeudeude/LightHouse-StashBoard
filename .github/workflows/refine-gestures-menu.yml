name: Apply gesture and menu refinements

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/refine-gestures-menu.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - name: Apply refinements
        run: python3 .github/scripts/refine_gestures_menu.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/board_screen_next.dart
          git commit -m "refine standing gesture and board menus"
          git push origin HEAD:lighthouse-2-rewrite
