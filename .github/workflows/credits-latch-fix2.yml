name: Fix credits latch

on:
  push:
    branches:
      - lighthouse-2-rewrite
    paths:
      - .github/workflows/credits-latch-fix2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply patch
        run: python3 .github/scripts/credits_latch_fix.py
      - name: Format
        run: dart format lib test
      - name: Verify
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ui/board_screen_next.dart
          git commit -m "fix: latch face-down credits until dismissed"
          git push origin HEAD:lighthouse-2-rewrite
