name: Bootstrap Flutter runners

on:
  push:
    branches:
      - lighthouse-2-rewrite
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lighthouse-2-rewrite
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform runners
        run: flutter create . --project-name lighthouse --org com.udeudeude --platforms=ios,android,web
      - name: Format Dart
        run: dart format lib test
      - name: Commit generated and formatted files
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No bootstrap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: generate Flutter runners and format source"
          git push origin HEAD:lighthouse-2-rewrite
