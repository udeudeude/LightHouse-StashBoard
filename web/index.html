<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="LightHouse: an interactive illuminated physical play surface for Looney Pyramids.">
  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LightHouse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">

  <title>LightHouse</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#000000;overscroll-behavior:none;touch-action:none;">
  <script>
    const lighthouseOrientationState = { angle: 0 };
    const lighthouseMotionState = {
      x: Number.NaN,
      y: Number.NaN,
      z: Number.NaN,
      installed: false,
    };

    function lighthouseNormalizeQuarterTurn(angle) {
      const normalized = ((Number(angle) % 360) + 360) % 360;
      return (Math.round(normalized / 90) * 90) % 360;
    }

    function lighthouseReadOrientationAngle() {
      if (typeof window.orientation === 'number') {
        return lighthouseNormalizeQuarterTurn(window.orientation);
      }
      if (screen.orientation && typeof screen.orientation.angle === 'number') {
        return lighthouseNormalizeQuarterTurn(screen.orientation.angle);
      }
      return window.innerWidth > window.innerHeight ? 90 : 0;
    }

    function lighthouseUpdateOrientation() {
      lighthouseOrientationState.angle = lighthouseReadOrientationAngle();
    }

    function lighthouseInstallMotionListener() {
      if (lighthouseMotionState.installed) return;
      lighthouseMotionState.installed = true;
      window.addEventListener('devicemotion', function (event) {
        const acceleration = event.accelerationIncludingGravity;
        if (!acceleration) return;
        lighthouseMotionState.x = Number(acceleration.x);
        lighthouseMotionState.y = Number(acceleration.y);
        lighthouseMotionState.z = Number(acceleration.z);
      }, { passive: true });
    }

    lighthouseUpdateOrientation();
    window.addEventListener('orientationchange', function () {
      lighthouseUpdateOrientation();
      window.setTimeout(lighthouseUpdateOrientation, 80);
      window.setTimeout(lighthouseUpdateOrientation, 300);
    });
    window.addEventListener('resize', lighthouseUpdateOrientation, { passive: true });

    window.lighthouseOrientationAngle = function () {
      return lighthouseOrientationState.angle;
    };

    window.lighthouseRequestMotionPermission = async function () {
      try {
        let granted = true;
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          granted = (await DeviceMotionEvent.requestPermission()) === 'granted';
        }
        if (granted) lighthouseInstallMotionListener();
        return granted;
      } catch (_) {
        return false;
      }
    };

    window.lighthouseMotionX = function () { return lighthouseMotionState.x; };
    window.lighthouseMotionY = function () { return lighthouseMotionState.y; };
    window.lighthouseMotionZ = function () { return lighthouseMotionState.z; };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
