<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="description" content="LightHouse: an interactive illuminated physical play surface for Looney Pyramids.">
  <meta name="theme-color" content="#000000">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LightHouse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>LightHouse</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#000000;overscroll-behavior:none;touch-action:none;">
  <script>
    window.lighthouseRequestMotionPermission = async function () {
      try {
        if (typeof DeviceMotionEvent !== 'undefined' &&
            typeof DeviceMotionEvent.requestPermission === 'function') {
          return (await DeviceMotionEvent.requestPermission()) === 'granted';
        }
        return true;
      } catch (_) {
        return false;
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
